services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bun_app
    restart: unless-stopped
    ports:
      - '4321:4321'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/bun_db
      - HOST=0.0.0.0
      - PORT=4321
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: bun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bun_db
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c shared_buffers=64MB
               -c max_connections=40
               -c work_mem=4MB
               -c maintenance_work_mem=16MB
               -c fsync=off
               -c synchronous_commit=off
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
